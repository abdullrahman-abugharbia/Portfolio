<section class="projects-section" id="work">
  <div class="container">
    <h2 class="section-title-light">Selected Projects</h2>
    <div class="section-divider"></div>

    <div class="row g-4">
      @for (project of projects; track project.title) {
        <div class="col-lg-6">
          <div class="project-card">
            <!-- Card Header / Preview -->
            <div class="project-preview"
              [style.background]="'linear-gradient(135deg, ' + project.gradientFrom + ', ' + project.gradientTo + ')'">
              <div class="preview-grid"></div>
              <div class="preview-icon">
                <i class="bi {{ project.icon }}"></i>
              </div>
              <div class="preview-dots">
                <span></span><span></span><span></span>
              </div>
            </div>

            <!-- Card Body -->
            <div class="project-body">
              <h3 class="project-title">{{ project.title }}</h3>
              <p class="project-desc">{{ project.description }}</p>

              <div class="project-tags d-flex flex-wrap gap-2 mt-3">
                @for (tag of project.tags; track tag) {
                  <span class="project-tag">{{ tag }}</span>
                }
              </div>

              <div class="project-footer d-flex align-items-center justify-content-between mt-4">
                <span class="stat">
                  <i class="bi bi-tag"></i> {{ project.label }}
                </span>
                @if (project.link) {
                  <a [href]="project.link" target="_blank" rel="noopener" class="btn-view-project">
                    Visit Website <i class="bi bi-arrow-right ms-1"></i>
                  </a>
                }
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
