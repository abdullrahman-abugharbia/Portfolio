<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <span class="footer__mark" aria-hidden="true">A</span>
      <div>
        <p class="footer__name">{{ profile.name }}</p>
        <p class="footer__title">{{ profile.title }}</p>
      </div>
    </div>

    <ul class="footer__social" aria-label="Social links">
      <li>
        <a class="btn-icon" [href]="profile.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="bi bi-linkedin" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a class="btn-icon" [href]="profile.github" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="bi bi-github" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a class="btn-icon" [href]="'mailto:' + profile.email" aria-label="Email">
          <i class="bi bi-envelope" aria-hidden="true"></i>
        </a>
      </li>
    </ul>
  </div>

  <div class="footer__bottom">
    <div class="container footer__bottom-inner">
      <p>© {{ year }} {{ profile.name }}. All rights reserved.</p>
      <a class="footer__top" href="#home">Back to top <i class="bi bi-arrow-up" aria-hidden="true"></i></a>
    </div>
  </div>
</footer>
